name: Bug report
description: Report a reproducible problem without private data.
body:
  - type: markdown
    attributes:
      value: "Never include tokens, state files, private URLs, chat identifiers, phone numbers or message content. Report security issues privately; see SECURITY.md."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, project version/commit and local/tunnel/remote mode.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected behavior
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Actual behavior and sanitized diagnostics
      description: Include the error category or correlation ID, never private data.
    validations:
      required: true
